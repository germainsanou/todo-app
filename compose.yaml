services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Capture les emails envoyés (codes de vérification…) : http://localhost:1080
  # Mêmes ports qu'un MailDev lancé avec `npx maildev` : arrêter l'un pour lancer l'autre.
  smtp:
    image: maildev/maildev:3.0.0
    restart: unless-stopped
    ports:
      - "127.0.0.1:1080:1080"
      - "127.0.0.1:1025:1025"

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      smtp:
        condition: service_started
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata: