name: CI

# Quand lancer la CI : à chaque PR, et à chaque mise à jour de main
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ---------- 1. Backend : vérifications + tests ----------
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Vérifier qu'aucune migration n'a été oubliée
        run: python manage.py makemigrations --check --dry-run

      - name: Lancer les tests
        run: python manage.py test

  # ---------- 2. Frontend : lint + compilation ----------
  frontend:
    name: Lint et build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------- 3. Docker : construire l'image (et la publier sur main) ----------
  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Connexion à GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'image (et la publier si on est sur main)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ghcr.io/germainsanou/todo-app:latest
            ghcr.io/germainsanou/todo-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- 4. Déploiement sur le VPS (uniquement sur main) ----------
  deploy:
    name: Déploiement
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - name: Configurer la connexion SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          # Vérifie que la clé est lisible (message d'erreur clair sinon)
          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null && echo "Clé SSH valide ✅"

      - name: Déployer sur le VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} 'bash -s' << 'EOF'
            set -e
            cd /var/www/todo-app
            git pull --ff-only
            docker compose -f compose.prod.yaml pull
            docker compose -f compose.prod.yaml up -d
            docker image prune -f
          EOF

      - name: Vérifier que le site répond
        run: |
          sleep 10
          curl -fsS --retry 5 --retry-delay 5 https://todo.inova-africa.com/api/todos/ > /dev/null
          echo "Site en ligne ✅"