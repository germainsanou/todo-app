name: CI

# Quand lancer la CI : à chaque PR, et à chaque mise à jour de main
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # ---------- 1. Backend : vérifications + tests ----------
  backend:
    name: Tests backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Vérifier la configuration Django
        run: python manage.py check

      - name: Vérifier qu'aucune migration n'a été oubliée
        run: python manage.py makemigrations --check --dry-run

      - name: Lancer les tests
        run: python manage.py test

  # ---------- 2. Frontend : lint + compilation ----------
  frontend:
    name: Lint et build frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installer les dépendances
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  # ---------- 3. Docker : l'image se construit-elle ? ----------
  docker:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - name: Construire l'image
        run: docker build -t todo-app:ci .